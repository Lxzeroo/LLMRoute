services:
  db:
    image: pgvector/pgvector:pg16
    container_name: llmroute-complete-db
    environment:
      POSTGRES_USER: llmroute
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: llmroute
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - complete_pgdata:/var/lib/postgresql/data
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U llmroute -d llmroute']
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  complete_pgdata:
