services:
  db:
    image: pgvector/pgvector:pg16
    container_name: llmroute-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: llmroute
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: llmroute

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - llmroute_pgdata:/var/lib/postgresql/data

    mem_limit: 768m
    cpus: 1.0

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmroute -d llmroute"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  llmroute_pgdata:
